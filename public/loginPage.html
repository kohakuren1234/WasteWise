  <section class="form-panel">
  <div class="glass-card">
    <div class="form-content">

      <!-- LOGIN FORM -->
      <div id="loginSection">
        <h2 class="form-title-alt">Sign In</h2>

        <div class="form-group-alt">
          <label class="label-alt">Username</label>
          <input type="text" id="logUser" class="input-alt" placeholder="Enter your username">
        </div>

        <div class="form-group-alt">
          <label class="label-alt">Password</label>
          <input type="password" id="logPass" class="input-alt" placeholder="Enter your password">
        </div>

        <button onclick="login()" type="button" class="submit-button-alt">
          <span class="button-text">Log In</span>
        </button>

        <p id="logMessage"></p>

        <div class="switch-section">
          New to EcoTrack? 
          <a href="#" onclick="showRegister()" class="switch-link-alt">Create Account</a>
        </div>
      </div>

      <!-- REGISTER FORM -->
      <div id="registerSection" style="display:none;">
        <h2 class="form-title-alt">Create Account</h2>

        <div class="form-group-alt">
          <label class="label-alt">Username</label>
          <input type="text" id="regUser" class="input-alt" placeholder="Enter your username">
        </div>

        <div class="form-group-alt">
          <label class="label-alt">Password</label>
          <input type="password" id="regPass" class="input-alt" placeholder="Enter your password">
        </div>

        <button onclick="register()" type="button" class="submit-button-alt">
          <span class="button-text">Sign Up</span>
        </button>

        <p id="regMessage"></p>

        <div class="switch-section">
          Already have an account?
          <a href="#" onclick="showLogin()" class="switch-link-alt">Sign In</a>
        </div>
      </div>

    </div>
